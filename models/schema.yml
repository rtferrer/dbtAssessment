version: 2

models:
  - name: customers
    description: One record per customer
    columns:
      - name: customer_id
        description: Primary key
        data_tests:
          - unique
          - not_null
      - name: first_order_date
        description: NULL when a customer has not yet placed an order.

  - name: stg_customers
    description: This model cleans up customer data
    columns:
      - name: customer_id
        description: Primary key
        data_tests:
          - unique
          - not_null

  - name: stg_orders
    description: This model cleans up order data
    columns:
      - name: order_id
        description: Primary key
        data_tests:
          - unique
          - not_null
      - name: status
        data_tests:
          - accepted_values:
              arguments: # available in v1.10.5 and higher. Older versions can set the <argument_name> as the top-level property.
                values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

# Added below for my assessment submission:
  - name: stg_payments
    description: This model cleans Stripe payment data
    columns:
      - name: payment_id
        description: Primary key
        data_tests:
          - not_null

  - name: rpt_daily_revenue
    description: Aggregated daily revenue and payment metrics from Stripe + Orders data
    columns:
      - name: payment_date
        description: Transaction date 
        data_tests:
          - not_null
      - name: total_revenue
        description: Sum of successful payments per day
      - name: payment_success_rate
        description: Percentage of successful payments vs total payments